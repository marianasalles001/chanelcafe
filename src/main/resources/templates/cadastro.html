<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar-se | Chanel Café</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="pagina-acesso">

<header class="menu-acesso">
    <a th:href="@{/}" class="logo">CHANEL CAFÉ</a>

    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/login}">Entrar</a>
    </nav>
</header>

<main class="conteudo-acesso">

    <section class="formulario-acesso">

        <h1>Crie sua conta</h1>

        <p class="descricao-acesso">
            Faça parte da experiência Chanel Café.
        </p>

        <form th:action="@{/cadastro}" method="post">

            <div class="campo-acesso">
                <label for="nome">Nome completo</label>

                <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required>
            </div>

            <div class="campo-acesso">
                <label for="email">E-mail</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>
            </div>

            <div class="campo-acesso">
                <label for="senha">Senha</label>

                <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        required>
            </div>

            <div class="campo-acesso">
                <label for="confirmar-senha">Confirmar senha</label>

                <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        required>
            </div>

            <button type="submit" class="botao-acesso">
                Cadastrar-se
            </button>

        </form>

        <div class="link-acesso">
            <p>
                Já tem uma conta?
                <a th:href="@{/login}">Entrar</a>
            </p>
        </div>

    </section>

</main>

<footer class="rodape-acesso">
    <p>© 2026 Chanel Café — Mais que café, uma experiência.</p>
</footer>

</body>
</html>
